name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Do not report it here: use "Report a vulnerability" on the Security tab. See SECURITY.md.
        Do not paste secrets, tokens or other people's personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
  - type: input
    id: where
    attributes:
      label: Where
      description: A page URL, or the commit you ran from source.
